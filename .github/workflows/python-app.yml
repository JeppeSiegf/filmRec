name: Python application

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        ports:
          - 5432:5432  # Custom port for PostgreSQL to avoid conflicts
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: film_test
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Create .env.test file
      run: |
        echo "testDbAddress=postgresql://postgres:${{ secrets.DB_PASSWORD }}@localhost:5432/film_test" > .env.test

    - name: Verify .env.test file
      run: |
        cat .env.test

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Initialize database schema
      run: |
        python -c "from your_app import create_app, db; app = create_app(); with app.app_context(): db.create_all()"

    - name: Check PostgreSQL status
      run: |
        pg_isready -h localhost -p 5432 -U postgres -d film_test

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        pytest --maxfail=1 --disable-warnings --tb=short

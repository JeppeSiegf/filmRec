services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - film_worker_state:/data
    networks:
      - filmrec_network

  scraper_worker:
    build: .
    container_name: filmrec_scraper
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - UPDATELOG_URL=redis://redis:6379/0
      - API_ADDRESS=http://192.168.87.142:5000
    depends_on:
      - redis
    volumes:
      - .:/app
    networks:
      - filmrec_network

volumes:
  film_worker_state:
    external: true

networks:
  filmrec_network:
    external: true



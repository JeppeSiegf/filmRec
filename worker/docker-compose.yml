version: '3.8'

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  worker:
    build:
      context: ..  # Build from parent directory
      dockerfile: worker/Dockerfile  # Specify Dockerfile location
    command: sh -c "sleep 5 && celery -A worker.run:app worker --beat --loglevel=info"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONPATH=/app
    depends_on:
      - redis

volumes:
  redis_data:
    external: true
    name: redis_redis_data